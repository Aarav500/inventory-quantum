<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Quantum - Rebalancing</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .map-card {
            padding: 0;
            overflow: hidden;
            height: 500px;
        }

        .transfer-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .transfer-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .transfer-route {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .location-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .transfer-details {
            text-align: right;
        }

        .transfer-qty {
            font-weight: 700;
            color: #10b981;
        }

        .cost-tag {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .badge-overstock {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .badge-understock {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .badge-balanced {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
    </style>
</head>

<body>
        <nav class="navbar">
        <div class="nav-brand"><span class="quantum-icon">⚛️</span><span>Inventory Quantum</span></div>
        <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')" aria-label="Toggle navigation">☰</button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="forecasting.html">Forecasting</a>
            <a href="chat.html">AI Chat</a>
            <a href="stockout.html">Stockout</a>
            <a href="savings.html">Savings</a>
            <a href="rebalancing.html" class="active">Rebalancing</a>
            <a href="scenario.html">Scenarios</a>
            <a href="supplier.html">Suppliers</a>
            <a href="optimization.html">Optimization</a>
            <a href="abc.html">ABC</a>
            <a href="locations.html">Locations</a>
            <a href="reorder.html">Reorder</a>
            <a href="integrations.html">Integrations</a>
        </div>
    </nav>

    <main class="container">
        <section class="hero" style="padding: 1.5rem 0;">
            <h1>🌍 Multi-Location Rebalancing</h1>
            <p class="hero-subtitle">Optimize inventory distribution across your entire network</p>
        </section>

        <section class="card map-card">
            <div id="networkMap" style="width: 100%; height: 100%;"></div>
        </section>

        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>📦 Recommended Transfers</h2>
                <button class="btn btn-primary" onclick="loadTransfers()">Recalculate Optimization</button>
            </div>
            <div class="transfer-list" id="transfers">
                <!-- Transfers will be loaded here -->
            </div>
        </section>
    </main>

    <script>
        async function loadNetwork() {
            try {
                const response = await fetch('/rebalancing/network');
                const data = await response.json();
                renderMap(data.locations);
                loadTransfers();
            } catch (e) { console.error(e); }
        }

        async function loadTransfers() {
            try {
                const response = await fetch('/rebalancing/optimize', { method: 'POST' });
                const data = await response.json();
                renderTransfers(data.transfers);
            } catch (e) { console.error(e); }
        }

        function renderMap(locations) {
            const lats = locations.map(l => l.lat);
            const lons = locations.map(l => l.lng);
            const texts = locations.map(l =>
                `${l.name}<br>Status: ${l.status.toUpperCase()}<br>Inv: ${l.inventory_level}`
            );

            const colors = locations.map(l =>
                l.status === 'overstock' ? '#ef4444' :
                    l.status === 'understock' ? '#f59e0b' : '#10b981'
            );

            const data = [{
                type: 'scattergeo',
                mode: 'markers+text',
                lat: lats,
                lon: lons,
                text: locations.map(l => l.id),
                hovertext: texts,
                textposition: 'top center',
                marker: {
                    size: 12,
                    color: colors,
                    line: { color: 'white', width: 2 }
                }
            }];

            const layout = {
                geo: {
                    scope: 'usa',
                    showland: true,
                    landcolor: '#1a1a3e',
                    bgcolor: 'rgba(0,0,0,0)',
                    lakecolor: '#0f0f2d',
                    subunitcolor: 'rgba(255,255,255,0.1)'
                },
                margin: { t: 0, b: 0, l: 0, r: 0 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#e0e0ff' }
            };

            Plotly.newPlot('networkMap', data, layout, { responsive: true, displayModeBar: false });
        }

        function renderTransfers(transfers) {
            document.getElementById('transfers').innerHTML = transfers.map(t => `
                <div class="transfer-item">
                    <div class="transfer-route">
                        <span class="location-badge" style="background: rgba(239, 68, 68, 0.2); color: #ef4444">${t.source_name}</span>
                        <span class="arrow">➜</span>
                        <span class="location-badge" style="background: rgba(16, 185, 129, 0.2); color: #10b981">${t.target_name}</span>
                        <span style="margin-left: 1rem; color: var(--text-secondary)">${t.distance_km} km</span>
                    </div>
                    <div class="transfer-details">
                        <div class="transfer-qty">${t.quantity} units of ${t.sku}</div>
                        <div class="cost-tag">Est. Cost: $${t.cost_estimate}</div>
                    </div>
                </div>
            `).join('');
        }

        loadNetwork();
    </script>
</body>

</html>
