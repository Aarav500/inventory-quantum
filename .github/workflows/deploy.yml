# GitHub Actions Workflow for Docker Deployment to AWS EC2
# Builds Docker image, uploads to S3, deploys to EC2 via SSM

name: Deploy to AWS (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: inventory-quantum
  DOCKER_IMAGE: inventory-quantum

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h
          echo "✅ Disk space freed"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and Push Docker Image
        run: |
          echo "🐳 Building Docker image..."
          
          # Build with no cache to keep it small
          docker build --no-cache -t ${{ env.DOCKER_IMAGE }}:latest .
          
          echo "📦 Saving and uploading Docker image..."
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip | aws s3 cp - s3://${{ secrets.S3_BUCKET_NAME }}/deployments/inventory-quantum-image.tar.gz
          
          echo "✅ Image uploaded to S3"
          
          # Clean up local image
          docker rmi ${{ env.DOCKER_IMAGE }}:latest || true
          docker system prune -af

      - name: Deploy to EC2 via SSM
        run: |
          echo "🚀 Deploying to EC2..."
          
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          REGION="${{ secrets.AWS_REGION }}"
          AWS_KEY="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
          echo "📍 Instance: $INSTANCE_ID"
          
          # Send SSM command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Inventory Quantum" \
            --parameters "commands=[
              \"echo '=== Cleaning up ===' \",
              \"sudo docker stop inventory-quantum 2>/dev/null || true\",
              \"sudo docker rm inventory-quantum 2>/dev/null || true\",
              \"sudo docker system prune -af\",
              \"echo '=== Downloading image ===' \",
              \"aws s3 cp s3://$S3_BUCKET/deployments/inventory-quantum-image.tar.gz /tmp/image.tar.gz --region $REGION\",
              \"echo '=== Loading image ===' \",
              \"gunzip -c /tmp/image.tar.gz | sudo docker load\",
              \"rm -f /tmp/image.tar.gz\",
              \"echo '=== Starting container ===' \",
              \"sudo docker run -d --name inventory-quantum --restart unless-stopped -p 8000:8000 -e AWS_REGION=$REGION -e S3_BUCKET=$S3_BUCKET -e AWS_ACCESS_KEY_ID=$AWS_KEY -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET inventory-quantum:latest\",
              \"sleep 5\",
              \"sudo docker ps\",
              \"echo '=== Done ===' \"
            ]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          
          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment..."
          
          # Wait for completion
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 10
          done

      - name: Show Application URL
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          echo ""
          echo "========================================"
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "========================================"
          echo "📊 Dashboard: http://$PUBLIC_IP:8000/static/index.html"
          echo "🔌 API: http://$PUBLIC_IP:8000"
          echo "========================================"
