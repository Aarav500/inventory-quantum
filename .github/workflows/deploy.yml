# GitHub Actions Workflow for Docker Deployment to AWS EC2
# Builds Docker image, uploads to S3, deploys to EC2 via SSM

name: Deploy to AWS (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: inventory-quantum
  DOCKER_IMAGE: inventory-quantum

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h
          echo "✅ Disk space freed"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Docker Image
        run: |
          echo "🐳 Building Docker image..."
          docker build --no-cache -t ${{ env.DOCKER_IMAGE }}:latest .
          echo "✅ Docker image built"

      - name: Save and Upload Docker Image
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "📦 Saving and uploading Docker image to S3..."
          echo "Bucket: $S3_BUCKET"
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > /tmp/docker-image.tar.gz
          ls -lh /tmp/docker-image.tar.gz
          aws s3 cp /tmp/docker-image.tar.gz s3://${S3_BUCKET}/deployments/inventory-quantum-image.tar.gz
          rm /tmp/docker-image.tar.gz
          echo "✅ Image uploaded to S3"

      - name: Deploy to EC2 via SSM
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION_VAL: ${{ secrets.AWS_REGION }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "🚀 Deploying to EC2..."
          
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          echo "📍 Instance: $INSTANCE_ID"
          echo "📍 Bucket: $S3_BUCKET"
          
          # Send SSM command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Inventory Quantum" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Environment Setup ===' \",
              \"export AWS_REGION=${AWS_REGION_VAL}\",
              \"echo 'Region: $AWS_REGION'\",
              \"echo 'Bucket: ${S3_BUCKET}'\",
              \"echo '=== Checking AWS CLI installation ===' \",
              \"export PATH=$PATH:/usr/local/bin\",
              \"if ! command -v aws &> /dev/null && [ ! -f /usr/local/bin/aws ]; then\",
              \"  echo 'AWS CLI not found. Installing...';\",
              \"  if [ -x \\\"$(command -v yum)\\\" ]; then\",
              \"    sudo yum install -y awscli;\",
              \"  else\",
              \"    sudo apt-get update && sudo apt-get install -y unzip curl;\",
              \"    curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o '/tmp/awscliv2.zip';\",
              \"    unzip -q /tmp/awscliv2.zip -d /tmp;\",
              \"    sudo /tmp/aws/install || sudo /tmp/aws/install --update;\",
              \"    rm -rf /tmp/awscliv2.zip /tmp/aws;\",
              \"  fi;\",
              \"else\",
              \"  echo 'AWS CLI already installed';\",
              \"fi\",
              \"aws --version || /usr/local/bin/aws --version\",
              \"echo '=== Checking Docker installation ===' \",
              \"if ! command -v docker &> /dev/null; then\",
              \"  echo 'Docker not found. Installing...';\",
              \"  if [ -x \\\"$(command -v yum)\\\" ]; then\",
              \"    echo 'Detected yum (Amazon Linux)...';\",
              \"    sudo yum update -y; sudo yum install -y docker;\",
              \"    sudo service docker start; sudo usermod -a -G docker ec2-user;\",
              \"  elif [ -x \\\"$(command -v apt-get)\\\" ]; then\",
              \"    echo 'Detected apt (Ubuntu)...';\",
              \"    sudo apt-get update; sudo apt-get install -y docker.io;\",
              \"    sudo service docker start; sudo usermod -a -G docker ubuntu;\",
              \"  fi;\",
              \"  sudo systemctl enable docker;\",
              \"fi\",
              \"sudo service docker start || true\",
              \"echo '=== Cleaning up ===' \",
              \"sudo docker stop inventory-quantum 2>/dev/null || true\",
              \"sudo docker rm inventory-quantum 2>/dev/null || true\",
              \"sudo docker system prune -af\",
              \"echo '=== Downloading image from S3 ===' \",
              \"if aws s3 cp s3://${S3_BUCKET}/deployments/inventory-quantum-image.tar.gz /tmp/image.tar.gz --region ${AWS_REGION_VAL}; then\",
              \"  echo 'Download successful'\",
              \"  ls -lh /tmp/image.tar.gz\",
              \"else\",
              \"  echo '❌ S3 Download Failed! Check IAM Role permissions.'\",
              \"  exit 1\",
              \"fi\",
              \"echo '=== Loading image ===' \",
              \"gunzip -c /tmp/image.tar.gz | sudo docker load\",
              \"sudo docker images\",
              \"rm -f /tmp/image.tar.gz\",

              \"echo '=== Starting container ===' \",
              \"sudo docker run -d --name inventory-quantum --restart unless-stopped -p 8000:8000 -e AWS_REGION=${AWS_REGION_VAL} -e S3_BUCKET=${S3_BUCKET} inventory-quantum:latest\",
              \"echo '=== Waiting for app to be ready ===' \",
              \"for i in \\$(seq 1 12); do curl -sf http://localhost:8000/health && break || echo \\\"Attempt \\$i: not ready yet\\\"; sleep 5; done\",
              \"echo '=== Verifying container ===' \",
              \"sudo docker ps\",
              \"sudo docker logs inventory-quantum 2>&1 | head -n 20\",
              \"echo '=== Done - run setup-nginx workflow to configure Nginx ===' \"
            ]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          
          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment..."
          
          # Wait for completion
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 10
          done

      - name: Post-deploy Validation
        env:
          AWS_REGION_VAL: ${{ secrets.AWS_REGION }}
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          echo "🔍 Running post-deploy validation via SSM..."

          VALIDATION_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Post-deploy health validation" \
            --parameters "commands=[
              \"set -e\",
              \"echo '--- Container status ---'\",
              \"sudo docker inspect --format '{{.State.Status}} (health: {{.State.Health.Status}})' inventory-quantum\",
              \"echo '--- GET /health ---'\",
              \"HEALTH=\\$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/health)\",
              \"echo \\\"HTTP status: \\$HEALTH\\\"\",
              \"[ \\\"\\$HEALTH\\\" = '200' ] || { echo 'FAIL: /health did not return 200'; exit 1; }\",
              \"echo '--- HEAD /health ---'\",
              \"HEAD_STATUS=\\$(curl -sI -o /dev/null -w '%{http_code}' http://localhost:8000/health)\",
              \"echo \\\"HTTP status: \\$HEAD_STATUS\\\"\",
              \"[ \\\"\\$HEAD_STATUS\\\" = '200' ] || { echo 'FAIL: HEAD /health did not return 200'; exit 1; }\",
              \"echo '--- GET / (root) ---'\",
              \"ROOT=\\$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/)\",
              \"echo \\\"HTTP status: \\$ROOT\\\"\",
              \"[ \\\"\\$ROOT\\\" = '200' ] || { echo 'FAIL: / did not return 200'; exit 1; }\",
              \"echo '--- Port 8000 listener ---'\",
              \"ss -tlnp | grep ':8000' || { echo 'FAIL: nothing listening on 8000'; exit 1; }\",
              \"echo '✅ All post-deploy checks passed'\"
            ]" \
            --timeout-seconds 60 \
            --query "Command.CommandId" \
            --output text)

          for i in {1..12}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$VALIDATION_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$VALIDATION_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "✅ Validation passed"
              break
            elif [ "$STATUS" = "Failed" ]; then
              aws ssm get-command-invocation \
                --command-id "$VALIDATION_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "❌ Post-deploy validation failed"
              exit 1
            fi
            sleep 5
          done

      - name: Show Application URL
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo ""
          echo "========================================"
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "========================================"
          echo "🌐 Domain: https://inventory.aarav-shah.com/static/index.html"
          echo "📊 Direct: http://$PUBLIC_IP:8000/static/index.html"
          echo "🔌 API: https://inventory.aarav-shah.com/"
          echo "========================================"
