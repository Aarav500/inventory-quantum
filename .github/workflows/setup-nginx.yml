# Nginx and SSL Setup Workflow
# Run this manually AFTER deploy.yml succeeds and DNS is configured

name: Setup Nginx + SSL

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Primary domain (e.g., aarav-shah.com)'
        required: true
        default: 'aarav-shah.com'
      skip_ssl:
        description: 'Skip SSL setup (for testing)'
        required: false
        default: 'false'

jobs:
  setup-nginx:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Nginx and SSL on EC2
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          SKIP_SSL: ${{ github.event.inputs.skip_ssl }}
        run: |
          echo "🌐 Setting up Nginx for $DOMAIN..."
          
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Setup Nginx and SSL" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Installing Nginx ===' \",
              \"sudo apt-get update && sudo apt-get install -y nginx certbot python3-certbot-nginx\",
              
              \"echo '=== Creating Nginx Config ===' \",
              \"sudo tee /etc/nginx/sites-available/inventory-quantum << 'NGINX_EOF'
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};
    
    location /inventory-forecasting/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host \\$host;
        proxy_set_header X-Real-IP \\$remote_addr;
        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \\$scheme;
    }
    
    location /inventory-forecasting {
        return 301 /inventory-forecasting/;
    }
    
    location / {
        return 200 'Inventory Quantum API. Visit /inventory-forecasting/ for the dashboard.';
        add_header Content-Type text/plain;
    }
}
NGINX_EOF\",
              
              \"echo '=== Enabling Site ===' \",
              \"sudo ln -sf /etc/nginx/sites-available/inventory-quantum /etc/nginx/sites-enabled/\",
              \"sudo rm -f /etc/nginx/sites-enabled/default\",
              \"sudo nginx -t\",
              \"sudo systemctl reload nginx\",
              
              \"echo '=== SSL Setup ===' \",
              \"if [ '${SKIP_SSL}' != 'true' ]; then\",
              \"  sudo certbot --nginx -d ${DOMAIN} -d www.${DOMAIN} --non-interactive --agree-tos -m admin@${DOMAIN} --redirect || echo 'SSL setup failed - check DNS'\",
              \"else\",
              \"  echo 'Skipping SSL (manual run later)'\",
              \"fi\",
              
              \"echo '=== Verifying ===' \",
              \"sudo nginx -t\",
              \"sudo systemctl status nginx --no-pager\",
              \"echo '✅ Nginx setup complete!'\"
            ]" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)
          
          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for setup..."
          
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Nginx setup succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Setup failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 10
          done

      - name: Test HTTP Redirect
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          echo "🧪 Testing HTTP → HTTPS redirect..."
          RESPONSE=$(curl -sI "http://$DOMAIN/inventory-forecasting/" 2>/dev/null | head -1)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "301\|302\|200"; then
            echo "✅ HTTP redirect working"
          else
            echo "⚠️ HTTP redirect may not be configured (expected if SSL skipped)"
          fi

      - name: Test HTTPS Endpoint
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          SKIP_SSL: ${{ github.event.inputs.skip_ssl }}
        run: |
          if [ "$SKIP_SSL" = "true" ]; then
            echo "⏭️ Skipping HTTPS test (SSL was skipped)"
            exit 0
          fi
          
          echo "🧪 Testing HTTPS endpoint..."
          RESPONSE=$(curl -sI "https://$DOMAIN/inventory-forecasting/health" 2>/dev/null | head -1)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "200"; then
            echo "✅ HTTPS endpoint healthy!"
          else
            echo "⚠️ HTTPS test failed - SSL may need manual setup"
          fi

      - name: Show Access URLs
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          echo ""
          echo "========================================"
          echo "🎉 NGINX SETUP COMPLETE!"
          echo "========================================"
          echo "📊 Dashboard: https://$DOMAIN/inventory-forecasting/static/index.html"
          echo "🔌 API: https://$DOMAIN/inventory-forecasting/"
          echo "❤️ Health: https://$DOMAIN/inventory-forecasting/health"
          echo "========================================"
