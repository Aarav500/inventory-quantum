# Nginx and SSL Setup Workflow
# Run this manually AFTER deploy.yml succeeds and DNS is configured

name: Setup Nginx + SSL

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Primary domain (e.g., inventory.aarav-shah.com)'
        required: true
        default: 'inventory.aarav-shah.com'
      include_www:
        description: 'Also request/configure www.<domain>'
        required: false
        default: 'false'
      skip_ssl:
        description: 'Skip SSL setup (for testing)'
        required: false
        default: 'false'

jobs:
  setup-nginx:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Nginx and SSL on EC2
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          INCLUDE_WWW: ${{ github.event.inputs.include_www }}
          SKIP_SSL: ${{ github.event.inputs.skip_ssl }}
        run: |
          echo "🌐 Setting up Nginx for $DOMAIN..."

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "=== Opening EC2 security group ports 80/443 ==="
          SECURITY_GROUP_IDS=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].SecurityGroups[].GroupId" \
            --output text)

          authorize_ingress() {
            local sg_id="$1"
            local port="$2"
            local err_file
            err_file=$(mktemp)

            if aws ec2 authorize-security-group-ingress \
              --group-id "$sg_id" \
              --protocol tcp \
              --port "$port" \
              --cidr 0.0.0.0/0 \
              2>"$err_file"; then
              echo "Opened tcp/${port} on ${sg_id}"
            elif grep -q "InvalidPermission.Duplicate" "$err_file"; then
              echo "tcp/${port} already open on ${sg_id}"
            else
              echo "Failed to open tcp/${port} on ${sg_id}"
              cat "$err_file"
              exit 1
            fi

            rm -f "$err_file"
          }

          for SG_ID in $SECURITY_GROUP_IDS; do
            authorize_ingress "$SG_ID" 80
            authorize_ingress "$SG_ID" 443
          done

          echo "=== Security group ingress after update ==="
          aws ec2 describe-security-groups \
            --group-ids $SECURITY_GROUP_IDS \
            --query "SecurityGroups[].{GroupId:GroupId,IpPermissions:IpPermissions}" \
            --output json

          SERVER_NAMES="$DOMAIN"
          CERTBOT_DOMAINS="-d ${DOMAIN}"
          if [ "$INCLUDE_WWW" = "true" ]; then
            SERVER_NAMES="$SERVER_NAMES www.$DOMAIN"
            CERTBOT_DOMAINS="$CERTBOT_DOMAINS -d www.${DOMAIN}"
          fi

          # Build nginx config as base64 using printf so all lines stay
          # indented within the YAML block scalar (heredoc content at col 0
          # breaks YAML parsing). $DOMAIN expands here; nginx vars stay literal
          # because they are in single-quoted printf arguments.
          NGINX_B64=$(printf '%s\n' \
            'server {' \
            '    listen 80;' \
            "    server_name ${SERVER_NAMES};" \
            '' \
            '    location / {' \
            '        proxy_pass http://127.0.0.1:8000;' \
            '        proxy_http_version 1.1;' \
            '        proxy_set_header Host $host;' \
            '        proxy_set_header X-Real-IP $remote_addr;' \
            '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
            '        proxy_set_header X-Forwarded-Proto $scheme;' \
            '    }' \
            '' \
            '    location /inventory-forecasting/ {' \
            '        proxy_pass http://127.0.0.1:8000/;' \
            '        proxy_http_version 1.1;' \
            '        proxy_set_header Host $host;' \
            '        proxy_set_header X-Real-IP $remote_addr;' \
            '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
            '        proxy_set_header X-Forwarded-Proto $scheme;' \
            '    }' \
            '' \
            '    location /inventory-forecasting {' \
            '        return 301 /inventory-forecasting/;' \
            '    }' \
            '}' | base64 -w0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Setup Nginx HTTP" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Installing Nginx ==='\",
              \"sudo apt-get update && sudo apt-get install -y nginx curl\",

              \"echo '=== Creating Nginx Config ==='\",
              \"echo '${NGINX_B64}' | base64 -d | sudo tee /etc/nginx/sites-available/inventory-quantum\",

              \"echo '=== Enabling Site ==='\",
              \"sudo ln -sf /etc/nginx/sites-available/inventory-quantum /etc/nginx/sites-enabled/\",
              \"sudo rm -f /etc/nginx/sites-enabled/default\",
              \"sudo nginx -t\",
              \"sudo systemctl reload nginx\",

              \"echo '=== Verifying ==='\",
              \"sudo nginx -t\",
              \"sudo systemctl status nginx --no-pager\",
              \"sudo ufw status || true\",
              \"ss -tlnp | grep ':80 '\",
              \"curl -sfI http://localhost/health\",
              \"echo 'Nginx HTTP setup complete!'\"
            ]" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)
          
          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for setup..."
          
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Nginx setup succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Setup failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 10
          done

      - name: Test Direct Origin
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Origin public IP: $PUBLIC_IP"
          curl -v -sfI --connect-timeout 10 --max-time 20 --resolve "$DOMAIN:80:$PUBLIC_IP" "http://$DOMAIN/health"

      - name: Setup SSL on EC2
        if: ${{ github.event.inputs.skip_ssl != 'true' }}
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          INCLUDE_WWW: ${{ github.event.inputs.include_www }}
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          CERTBOT_DOMAINS="-d ${DOMAIN}"
          if [ "$INCLUDE_WWW" = "true" ]; then
            CERTBOT_DOMAINS="$CERTBOT_DOMAINS -d www.${DOMAIN}"
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Setup Nginx SSL" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Installing Certbot ==='\",
              \"sudo apt-get update && sudo apt-get install -y certbot python3-certbot-nginx\",
              \"echo '=== SSL Setup ==='\",
              \"sudo certbot --nginx ${CERTBOT_DOMAINS} --non-interactive --agree-tos -m admin@${DOMAIN} --redirect\",
              \"echo '=== Verifying SSL ==='\",
              \"sudo nginx -t\",
              \"sudo systemctl status nginx --no-pager\",
              \"ss -tlnp | grep -E ':(80|443) '\",
              \"curl -sfI http://localhost/health\",
              \"echo 'Nginx SSL setup complete!'\"
            ]" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "📋 SSL Command ID: $COMMAND_ID"
          echo "⏳ Waiting for SSL setup..."

          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ SSL setup succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ SSL setup failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

      - name: Test Direct HTTPS Origin
        if: ${{ github.event.inputs.skip_ssl != 'true' }}
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Origin public IP: $PUBLIC_IP"
          curl -sfI --resolve "$DOMAIN:443:$PUBLIC_IP" "https://$DOMAIN/health"

      - name: Test HTTP Redirect
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          echo "🧪 Testing HTTP → HTTPS redirect..."
          RESPONSE=$(curl -sI "http://$DOMAIN/health" 2>/dev/null | head -1)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "301\|302\|200"; then
            echo "✅ HTTP redirect working"
          else
            echo "❌ HTTP redirect is not working"
            exit 1
          fi

      - name: Test HTTPS Endpoint
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          SKIP_SSL: ${{ github.event.inputs.skip_ssl }}
        run: |
          if [ "$SKIP_SSL" = "true" ]; then
            echo "⏭️ Skipping HTTPS test (SSL was skipped)"
            exit 0
          fi
          
          echo "🧪 Testing HTTPS endpoint..."
          RESPONSE=$(curl -sI "https://$DOMAIN/health" 2>/dev/null | head -1)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "200"; then
            echo "✅ HTTPS endpoint healthy!"
          else
            echo "❌ HTTPS test failed"
            exit 1
          fi

      - name: Show Access URLs
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          echo ""
          echo "========================================"
          echo "🎉 NGINX SETUP COMPLETE!"
          echo "========================================"
          echo "📊 Dashboard: https://$DOMAIN/"
          echo "🔌 API: https://$DOMAIN/"
          echo "❤️ Health: https://$DOMAIN/health"
          echo "========================================"
