name: Debug EC2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run Diagnostics via SSM
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          echo "🔍 Diagnosing Instance: $INSTANCE_ID"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Debug Inventory Quantum" \
            --parameters "commands=[
              \"echo '=== 1. Docker Containers ==='\",
              \"sudo docker ps -a\",
              \"echo ''\",
              \"echo '=== 2. Container Logs (Last 50 lines) ==='\",
              \"sudo docker logs --tail 50 inventory-quantum 2>&1 || echo 'No logs found'\",
              \"echo ''\",
              \"echo '=== 3. Network Ports ==='\",
              \"sudo netstat -tulpn | grep 8000 || echo 'Nothing on port 8000'\",
              \"sudo ss -tulpn | grep 8000 || echo 'Nothing on ss 8000'\",
              \"echo ''\",
              \"echo '=== 4. Local Connectivity Test ==='\",
              \"curl -v http://localhost:8000/health 2>&1 || echo 'Curl failed'\",
              \"echo ''\",
              \"echo '=== 5. Disk Space ==='\",
              \"df -h\",
              \"echo ''\",
              \"echo '=== 6. Security Group Check (from instance view) ==='\",
              \"curl -s http://checkip.amazonaws.com || echo 'Cannot reach external internet'\"
            ]" \
            --query "Command.CommandId" \
            --output text)
            
          echo "📋 Command ID: $COMMAND_ID"
          sleep 5
          
          # Wait and get output
          PROCESS_STATUS="Pending"
          while [ "$PROCESS_STATUS" == "Pending" ] || [ "$PROCESS_STATUS" == "InProgress" ]; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" == "Success" ]; then
                aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
                break
            elif [ "$STATUS" == "Failed" ]; then
                echo "❌ Debug command failed to run"
                aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
                aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].StandardErrorContent" --output text
                break
            fi
            sleep 5
          done
